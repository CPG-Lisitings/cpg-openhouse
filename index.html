<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open House Schedule | Chelsea Phillips Group</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink: #e8185a;
      --pink-light: #f2c4ce;
      --green: #3d6b2c;
      --green-accent: #6a9e50;
      --dark: #1c1c1c;
      --light: #faf8f2;
      --mid: #888;
      --border: #e0ddd4;
      --white: #ffffff;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--light);
      color: var(--dark);
      min-height: 100vh;
    }

    /* HEADER */
    .site-header {
      background: var(--dark);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .site-header .logo {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--white);
    }
    .site-header .logo span { color: var(--pink); }
    .header-tag {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--mid);
    }

    /* MAIN LAYOUT */
    .container {
      max-width: 780px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
    }

    /* PAGE TITLE ROW */
    .title-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .title-row h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--dark);
      line-height: 1.1;
    }
    .title-row h1 span { color: var(--pink); }

    /* MONTH NAV */
    .month-nav {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--white);
      border: 0.5px solid var(--border);
      border-radius: 30px;
      padding: 6px 10px;
    }
    .month-nav button {
      background: none;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--dark);
      transition: background 0.15s;
    }
    .month-nav button:hover { background: var(--light); }
    .month-nav .month-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--dark);
      min-width: 130px;
      text-align: center;
    }

    /* STATS */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: var(--white);
      border: 0.5px solid var(--border);
      border-radius: 10px;
      padding: 14px 12px;
      text-align: center;
    }
    .stat-num {
      font-size: 28px;
      font-weight: 800;
      color: var(--dark);
      line-height: 1;
    }
    .stat-num.green { color: var(--green); }
    .stat-num.pink { color: var(--pink); }
    .stat-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--mid);
      margin-top: 4px;
    }

    /* FILTERS */
    .filter-row {
      display: flex;
      gap: 8px;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
    }
    .filter-btn {
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 6px 16px;
      border-radius: 30px;
      border: 1px solid var(--border);
      background: none;
      cursor: pointer;
      color: var(--mid);
      transition: all 0.15s;
    }
    .filter-btn:hover { border-color: var(--dark); color: var(--dark); }
    .filter-btn.active { background: var(--dark); color: var(--white); border-color: var(--dark); }

    /* LOADING / ERROR / EMPTY */
    .status-msg {
      text-align: center;
      padding: 3rem 1rem;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--mid);
    }
    .status-msg.error { color: var(--pink); }

    /* LISTING CARDS */
    .listings { display: flex; flex-direction: column; gap: 10px; }

    .listing-card {
      background: var(--white);
      border: 0.5px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: box-shadow 0.15s;
    }
    .listing-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.07); }
    .listing-card.is-open { border-left: 3px solid var(--green); }
    .listing-card.is-claimed { border-left: 3px solid var(--pink); }

    .card-date {
      text-align: center;
      min-width: 46px;
    }
    .card-date .day-num {
      font-size: 26px;
      font-weight: 800;
      color: var(--dark);
      line-height: 1;
    }
    .card-date .day-name {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--mid);
      margin-top: 2px;
    }

    .card-divider {
      width: 1px;
      background: var(--border);
      align-self: stretch;
      min-height: 44px;
    }

    .card-info { flex: 1; min-width: 0; }
    .card-address {
      font-size: 15px;
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-meta {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--mid);
      font-weight: 500;
    }
    .card-price { font-weight: 700; color: var(--dark); }

    .card-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      min-width: 100px;
    }

    .badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 30px;
      white-space: nowrap;
    }
    .badge.open { background: #e8f5e2; color: var(--green); }
    .badge.claimed { background: #fce8ef; color: var(--pink); }

    .claim-btn {
      font-family: 'Montserrat', sans-serif;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      padding: 7px 16px;
      border-radius: 30px;
      border: none;
      background: var(--dark);
      color: var(--white);
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .claim-btn:hover { background: var(--pink); }

    .claimed-by-name {
      font-size: 12px;
      font-weight: 700;
      color: var(--pink);
      text-align: right;
    }

    /* MODAL */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(28,28,28,0.6);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--white);
      border-radius: 16px;
      padding: 28px 28px 24px;
      width: 100%;
      max-width: 380px;
    }
    .modal-eyebrow {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--pink);
      margin-bottom: 6px;
    }
    .modal h2 {
      font-size: 18px;
      font-weight: 800;
      color: var(--dark);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .modal-sub {
      font-size: 12px;
      color: var(--mid);
      font-weight: 500;
      margin-bottom: 22px;
    }
    .modal label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--mid);
      margin-bottom: 6px;
    }
    .modal input {
      font-family: 'Montserrat', sans-serif;
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 14px;
      font-size: 14px;
      color: var(--dark);
      outline: none;
      margin-bottom: 14px;
      transition: border-color 0.15s;
      background: var(--light);
    }
    .modal input:focus { border-color: var(--pink); background: var(--white); }
    .modal-actions { display: flex; gap: 10px; margin-top: 4px; }
    .btn-cancel {
      font-family: 'Montserrat', sans-serif;
      flex: 1;
      padding: 11px;
      border: 1px solid var(--border);
      background: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      color: var(--mid);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      transition: all 0.15s;
    }
    .btn-cancel:hover { border-color: var(--dark); color: var(--dark); }
    .btn-confirm {
      font-family: 'Montserrat', sans-serif;
      flex: 2;
      padding: 11px;
      border: none;
      background: var(--pink);
      color: var(--white);
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      transition: background 0.15s;
    }
    .btn-confirm:hover { background: #c4144d; }
    .btn-confirm:disabled { background: var(--border); cursor: not-allowed; }

    /* SUCCESS TOAST */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--dark);
      color: var(--white);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 12px 24px;
      border-radius: 30px;
      opacity: 0;
      transition: all 0.3s;
      z-index: 300;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast .toast-pink { color: var(--pink); }

    /* CONFIG NOTICE */
    .config-notice {
      background: #fff8ea;
      border: 1px solid #f5d48a;
      border-radius: 10px;
      padding: 14px 18px;
      font-size: 12px;
      color: #7a5c00;
      margin-bottom: 1.5rem;
      line-height: 1.6;
      display: none;
    }
    .config-notice strong { font-weight: 700; }

    @media (max-width: 540px) {
      .site-header { padding: 1rem; }
      .container { padding: 1.5rem 1rem 3rem; }
      .title-row h1 { font-size: 20px; }
      .card-meta { gap: 8px; }
      .stats { gap: 8px; }
      .stat-num { font-size: 22px; }
    }
  </style>
</head>
<body>

<header class="site-header">
  <div class="logo">Chelsea Phillips <span>Group</span></div>
  <div class="header-tag">Agent Portal</div>
</header>

<main class="container">

  <div class="title-row">
    <h1>Open House<br><span>Schedule</span></h1>
    <div class="month-nav">
      <button id="prev-btn" aria-label="Previous month">&#8249;</button>
      <div class="month-label" id="month-label"></div>
      <button id="next-btn" aria-label="Next month">&#8250;</button>
    </div>
  </div>

  <div id="config-notice" class="config-notice">
    <strong>Setup needed.</strong> Open <code>config.js</code> and add your Google Apps Script Web App URL to connect this app to your Google Sheet. See the setup guide for instructions.
  </div>

  <div class="stats">
    <div class="stat-card"><div class="stat-num" id="stat-total">0</div><div class="stat-label">Total</div></div>
    <div class="stat-card"><div class="stat-num green" id="stat-open">0</div><div class="stat-label">Open</div></div>
    <div class="stat-card"><div class="stat-num pink" id="stat-claimed">0</div><div class="stat-label">Claimed</div></div>
  </div>

  <div class="filter-row">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="open">Open</button>
    <button class="filter-btn" data-filter="claimed">Claimed</button>
  </div>

  <div id="listings-container"></div>

</main>

<!-- CLAIM MODAL -->
<div class="modal-overlay" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal">
    <div class="modal-eyebrow">Claim This Slot</div>
    <h2 id="modal-title">Sign Up</h2>
    <div class="modal-sub" id="modal-sub"></div>
    <label for="input-name">Your Name</label>
    <input type="text" id="input-name" placeholder="First Last" autocomplete="name" />
    <label for="input-email">Your Email</label>
    <input type="email" id="input-email" placeholder="you@chelseaphillipsgroup.com" autocomplete="email" />
    <div class="modal-actions">
      <button class="btn-cancel" id="modal-cancel">Cancel</button>
      <button class="btn-confirm" id="modal-confirm">Claim It</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"><span class="toast-pink">&#10003;</span> &nbsp;Slot claimed!</div>

<script src="config.js"></script>
<script>
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  let currentMonth = new Date().getMonth();
  let currentYear = new Date().getFullYear();
  let activeFilter = 'all';
  let selectedRow = null;
  let allListings = [];

  const $ = id => document.getElementById(id);

  // ── GOOGLE SHEETS API ──────────────────────────────────────────
  const SCRIPT_URL = (typeof CPG_CONFIG !== 'undefined') ? CPG_CONFIG.scriptUrl : '';

  async function fetchListings(month, year) {
    if (!SCRIPT_URL) return getDemoListings(month, year);
    const url = `${SCRIPT_URL}?action=get&month=${month + 1}&year=${year}`;
    const res = await fetch(url);
    const data = await res.json();
    return data;
  }

  async function claimSlot(rowIndex, name, email) {
    if (!SCRIPT_URL) return claimDemo(rowIndex, name, email);
    const url = `${SCRIPT_URL}?action=claim&row=${rowIndex}&name=${encodeURIComponent(name)}&email=${encodeURIComponent(email)}`;
    const res = await fetch(url);
    const data = await res.json();
    return data;
  }

  // ── DEMO DATA (shown before Google Sheet is connected) ─────────
  function getDemoListings(month, year) {
    const sat1 = new Date(year, month, 1);
    while (sat1.getDay() !== 6) sat1.setDate(sat1.getDate() + 1);
    const sat2 = new Date(sat1); sat2.setDate(sat1.getDate() + 7);
    const sat3 = new Date(sat1); sat3.setDate(sat1.getDate() + 14);
    const sun1 = new Date(sat1); sun1.setDate(sat1.getDate() + 1);
    const sun2 = new Date(sat2); sun2.setDate(sat2.getDate() + 1);

    const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

    return [
      { row: 2, date: fmt(sat1), address: '214 E 38th St', neighborhood: 'Ardsley Park', time: '1:00 PM – 3:00 PM', price: '$525,000', agentName: '', agentEmail: '' },
      { row: 3, date: fmt(sat1), address: '603 Whitaker St', neighborhood: 'Thomas Square', time: '12:00 PM – 2:00 PM', price: '$389,000', agentName: '', agentEmail: '' },
      { row: 4, date: fmt(sun1), address: '18 W Jones St', neighborhood: 'Downtown', time: '2:00 PM – 4:00 PM', price: '$895,000', agentName: 'Sarah Monroe', agentEmail: 'sarah@cpg.com' },
      { row: 5, date: fmt(sat2), address: '47 Habersham St', neighborhood: 'Cuyler-Brownson', time: '11:00 AM – 1:00 PM', price: '$445,000', agentName: '', agentEmail: '' },
      { row: 6, date: fmt(sun2), address: '512 E Bolton St', neighborhood: 'Victorian District', time: '1:00 PM – 3:00 PM', price: '$679,000', agentName: 'James Tillman', agentEmail: 'james@cpg.com' },
      { row: 7, date: fmt(sat3), address: '301 Drayton St', neighborhood: 'Midtown', time: '12:00 PM – 2:00 PM', price: '$310,000', agentName: '', agentEmail: '' },
    ];
  }

  function claimDemo(rowIndex, name, email) {
    const item = allListings.find(l => l.row === rowIndex);
    if (item) { item.agentName = name; item.agentEmail = email; }
    return { success: true };
  }

  // ── RENDER ─────────────────────────────────────────────────────
  function formatDate(dateStr) {
    const [y, m, d] = dateStr.split('-').map(Number);
    const dt = new Date(y, m - 1, d);
    return { dayNum: d, dayName: DAYS[dt.getDay()] };
  }

  function updateStats() {
    const open = allListings.filter(l => !l.agentName).length;
    const claimed = allListings.filter(l => l.agentName).length;
    $('stat-total').textContent = allListings.length;
    $('stat-open').textContent = open;
    $('stat-claimed').textContent = claimed;
  }

  function renderListings() {
    updateStats();
    const filtered = activeFilter === 'all' ? allListings
      : activeFilter === 'open' ? allListings.filter(l => !l.agentName)
      : allListings.filter(l => l.agentName);

    const container = $('listings-container');

    if (!filtered.length) {
      container.innerHTML = `<div class="status-msg">No open houses this month</div>`;
      return;
    }

    container.innerHTML = `<div class="listings">${filtered.map(l => {
      const { dayNum, dayName } = formatDate(l.date);
      const isClaimed = !!l.agentName;
      return `
        <div class="listing-card ${isClaimed ? 'is-claimed' : 'is-open'}">
          <div class="card-date">
            <div class="day-num">${dayNum}</div>
            <div class="day-name">${dayName}</div>
          </div>
          <div class="card-divider"></div>
          <div class="card-info">
            <div class="card-address">${l.address}</div>
            <div class="card-meta">
              <span>${l.neighborhood}</span>
              <span>${l.time}</span>
              <span class="card-price">${l.price}</span>
            </div>
          </div>
          <div class="card-right">
            <span class="badge ${isClaimed ? 'claimed' : 'open'}">${isClaimed ? 'Claimed' : 'Open'}</span>
            ${isClaimed
              ? `<div class="claimed-by-name">${l.agentName}</div>`
              : `<button class="claim-btn" data-row="${l.row}" data-addr="${l.address}" data-time="${l.time}">Claim</button>`
            }
          </div>
        </div>`;
    }).join('')}</div>`;

    document.querySelectorAll('.claim-btn').forEach(btn => {
      btn.addEventListener('click', () => openModal(
        parseInt(btn.dataset.row),
        btn.dataset.addr,
        btn.dataset.time
      ));
    });
  }

  async function loadMonth() {
    $('listings-container').innerHTML = `<div class="status-msg">Loading...</div>`;
    $('month-label').textContent = `${MONTHS[currentMonth]} ${currentYear}`;
    try {
      allListings = await fetchListings(currentMonth, currentYear);
      if (!SCRIPT_URL) $('config-notice').style.display = 'block';
      renderListings();
    } catch (e) {
      $('listings-container').innerHTML = `<div class="status-msg error">Could not load schedule. Check your connection and try again.</div>`;
    }
  }

  // ── MODAL ──────────────────────────────────────────────────────
  function openModal(row, address, time) {
    selectedRow = row;
    $('modal-title').textContent = address;
    $('modal-sub').textContent = time;
    $('input-name').value = '';
    $('input-email').value = '';
    $('modal').classList.add('active');
    $('input-name').focus();
  }

  function closeModal() {
    $('modal').classList.remove('active');
    selectedRow = null;
  }

  $('modal-cancel').addEventListener('click', closeModal);
  $('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });

  $('modal-confirm').addEventListener('click', async () => {
    const name = $('input-name').value.trim();
    const email = $('input-email').value.trim();
    if (!name) { $('input-name').focus(); return; }

    const btn = $('modal-confirm');
    btn.disabled = true;
    btn.textContent = 'Saving...';

    try {
      await claimSlot(selectedRow, name, email);
      closeModal();
      await loadMonth();
      showToast();
    } catch (e) {
      btn.disabled = false;
      btn.textContent = 'Claim It';
      alert('Something went wrong. Please try again.');
    }
  });

  // ── TOAST ──────────────────────────────────────────────────────
  function showToast() {
    const t = $('toast');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  // ── FILTERS & NAV ──────────────────────────────────────────────
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      activeFilter = btn.dataset.filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderListings();
    });
  });

  $('prev-btn').addEventListener('click', () => {
    currentMonth--;
    if (currentMonth < 0) { currentMonth = 11; currentYear--; }
    loadMonth();
  });

  $('next-btn').addEventListener('click', () => {
    currentMonth++;
    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    loadMonth();
  });

  // ── KEYBOARD ──────────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
    if (e.key === 'Enter' && $('modal').classList.contains('active')) $('modal-confirm').click();
  });

  // ── INIT ──────────────────────────────────────────────────────
  loadMonth();
</script>
</body>
</html>
